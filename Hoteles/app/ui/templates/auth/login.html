{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h2>Iniciar sesión</h2>
  <p class="muted">Accede para ver tus reservas.</p>

  <form class="form" method="post" action="/login">
    <label class="label">Email
      <input class="input" name="email" type="email" required>
    </label>
    <label class="label">Contraseña
      <input class="input" name="password" type="password" required>
    </label>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <input type="hidden" name="next" value="{{ next or '/my-reservations' }}">

    <div class="row">
      <button class="btn btn--primary" type="submit">Entrar</button>
      <a class="btn btn--ghost" href="/register?next={{ next or '/my-reservations' }}">Crear cuenta</a>
    </div>
  </form>
</section>
{% endblock %}
